name: clip-produce-pc
# Same as clip-produce, but runs on your own PC (home internet) because YouTube blocks GitHub's servers.
on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Max sources to process this run"
        default: "2"

concurrency: { group: clip-produce-pc, cancel-in-progress: false }

jobs:
  produce:
    runs-on: [self-hosted, windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
        working-directory: clip-pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      WHISPER_MODEL: base
    steps:
      - uses: actions/checkout@v4
      - name: Python environment and font
        run: |
          $py = "..\..\.clipvenv\Scripts\python.exe"
          if (-not (Test-Path $py)) { python -m venv ..\..\.clipvenv }
          & $py -m pip install -q -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path fonts | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf" -OutFile "fonts\BebasNeue-Regular.ttf"
      - name: Produce clips
        run: |
          & "..\..\.clipvenv\Scripts\python.exe" -m pipeline.cli produce --max-sources ${{ inputs.max_sources || '2' }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

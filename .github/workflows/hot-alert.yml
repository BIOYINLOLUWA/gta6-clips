name: hot-alert
# Every 3 hours: Telegram message listing Twitch streamers on GTA 6 with 500+ viewers.
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

concurrency: { group: hot-alert, cancel-in-progress: false }

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: clip-pipeline } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests PyYAML "psycopg[binary]"
      - run: python -m pipeline.cli hot

name: clip-produce
# Discover new VODs -> find moments -> render -> send to Telegram for review.
on:
  schedule:
    - cron: "15 */4 * * *"   # every 4h; change to */2 for launch week
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Max sources to process this run"
        default: "3"

concurrency: { group: clip-produce, cancel-in-progress: false }

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: clip-pipeline } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WHISPER_MODEL: base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sSL -o fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf
      - name: Whisper model cache
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base-v1 }
      - run: pip install -r requirements.txt
      - run: python -m pipeline.cli produce --max-sources ${{ inputs.max_sources || '3' }}
